server.port=8082
server.address=0.0.0.0

spring.main.web-application-type=none

# RabbitMQ input queues
app.rabbitmq.host=localhost
app.rabbitmq.port=5672
app.rabbitmq.virtual-host=/
app.rabbitmq.username=guest
app.rabbitmq.password=guest
app.rabbitmq.num-rooms=20

# Consumer threads and queue prefetch
app.consumer.threads=20
app.consumer.prefetch-count=500
app.dedupe.per-room-capacity=10000

# server-v2 instances for internal broadcast API
app.servers.urls=http://localhost:8080

# Persistence tuning knobs (Assignment 3)
app.persistence.db-writer-threads=4
app.persistence.batch-size=500
app.persistence.flush-interval-ms=500
app.persistence.queue-capacity=50000
app.retry.max-attempts=5
app.retry.backoff-base-ms=200
app.db.circuit-open-threshold=5
app.db.circuit-retry-ms=10000

# PostgreSQL
spring.datasource.url=jdbc:postgresql://172.31.67.249:5432/chatdb
spring.datasource.username=chat
spring.datasource.password=chatpass
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
