# Server
server.port=8080
server.address=0.0.0.0

# Identity for queue messages (e.g. server-1, server-2 behind ALB)
app.server.id=server-1

# RabbitMQ
app.queue.host=localhost
app.queue.port=5672
app.queue.virtual-host=/
app.queue.username=guest
app.queue.password=guest
app.queue.exchange-name=chat.exchange
app.queue.routing-key-prefix=room.
app.queue.num-rooms=20
app.queue.pool-size=10
app.queue.message-ttl-ms=0
app.queue.max-length=0
app.queue.max-length-bytes=0
app.queue.publisher-confirms=true
app.queue.circuit-open-threshold=5
app.queue.circuit-retry-ms=10000
