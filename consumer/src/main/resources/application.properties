# Consumer app port (for health check only; no WebSocket here)
server.port=8081
server.address=0.0.0.0

# RabbitMQ - same as server-v2
app.rabbitmq.host=172.31.79.33
app.rabbitmq.port=5672
app.rabbitmq.virtual-host=/
app.rabbitmq.username=guest
app.rabbitmq.password=guest
app.rabbitmq.exchange-name=chat.exchange
app.rabbitmq.num-rooms=20

# Consumer pool: number of threads (each consumes one queue room.1 .. room.num-rooms)
app.consumer.threads=20
app.consumer.prefetch-count=500

# Best-effort dedupe to tolerate retries
app.dedupe.per-room-capacity=10000

# Server-v2 base URLs for internal broadcast (comma-separated). Consumer POSTs to each.
# Example: http://10.0.1.10:8080,http://10.0.1.11:8080
app.servers.urls=http://18.215.170.227:8080
